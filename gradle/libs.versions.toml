[versions]
springBoot = "4.1.2"
# Only libraries Spring Boot does not manage are pinned. JUnit, AssertJ, Flyway,
# Testcontainers, the PostgreSQL driver, Netty, Jackson and Reactor all come from
# the Boot BOM (spring-boot-dependencies).
awsSdk = "2.59.1"
bouncycastle = "1.87"
nimbusJoseJwt = "10.10"
yubicoWebauthn = "2.10.1"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

# Boot-managed (no version here)
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-webflux-test = { module = "org.springframework.boot:spring-boot-starter-webflux-test" }
spring-boot-starter-jdbc-test = { module = "org.springframework.boot:spring-boot-starter-jdbc-test" }
spring-boot-starter-flyway-test = { module = "org.springframework.boot:spring-boot-starter-flyway-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
reactor-test = { module = "io.projectreactor:reactor-test" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }

# Pinned (not managed by Boot)
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awsSdk" }
aws-kms = { module = "software.amazon.awssdk:kms" }
aws-url-connection-client = { module = "software.amazon.awssdk:url-connection-client" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJoseJwt" }
yubico-webauthn-server-core = { module = "com.yubico:webauthn-server-core", version.ref = "yubicoWebauthn" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
