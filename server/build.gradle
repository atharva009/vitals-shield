plugins {
    id 'vitalsshield.test-tiers'
    alias(libs.plugins.spring.boot)
}

dependencies {
    implementation platform(libs.spring.boot.dependencies)
    implementation platform(libs.aws.sdk.bom)

    implementation project(':crypto-common')
    implementation libs.spring.boot.starter.webflux
    implementation libs.spring.boot.starter.jdbc
    // Boot 4 is modular: without this starter Flyway is on the classpath but never runs.
    implementation libs.spring.boot.starter.flyway
    implementation libs.flyway.database.postgresql
    runtimeOnly libs.postgresql
    // Sync KMS client on the JDK HTTP stack. The SDK's Netty (async) and Apache
    // HTTP clients are excluded so neither can be picked up by accident.
    implementation(libs.aws.kms) {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
    }
    implementation libs.aws.url.connection.client
    implementation libs.bcpkix
    implementation libs.nimbus.jose.jwt

    testImplementation project(':simulator')
    testImplementation libs.spring.boot.starter.webflux.test
    testImplementation libs.spring.boot.starter.jdbc.test
    testImplementation libs.spring.boot.starter.flyway.test
    testImplementation libs.reactor.test
    testImplementation libs.spring.boot.testcontainers
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.junit.jupiter
}

// Run from the repo root so relative paths (var/trust/root-ca.pem) resolve there, not under server/.
tasks.named('bootRun') {
    workingDir = rootProject.projectDir
}

tasks.withType(Test).configureEach {
    systemProperty 'vitalsshield.repoRoot', rootProject.projectDir.absolutePath
}

// Dev-only seed tool (DECISIONS #32): runs from the test classpath against the local Compose database.
tasks.register('seedDemoDevice', JavaExec) {
    group = 'vitalsshield'
    description = 'Seeds a demo device, ACTIVE assignment and bootstrap token in the local Compose Postgres.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.vitalsshield.devtools.SeedDemoDevice'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
