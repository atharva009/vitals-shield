# Demo profile (DECISIONS 99): every rehearsal and the live run use --spring.profiles.active=demo. It extends `local`
# (LocalStack KMS, hierarchy rebuild allowed) and then applies the stage values in demo-stage.yml. Imports listed
# later take precedence, so demo-stage.yml wins over application-local.yml.
#
# Phase 10a.1 fix: 10a used a profile group (demo: local), which applies local AFTER demo, so local's leaf-ttl PT4M
# silently overrode demo's PT3M. DemoProfileTest checks the effective values.
spring:
  config:
    import:
      - classpath:application-local.yml
      - classpath:demo-stage.yml
