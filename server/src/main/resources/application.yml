spring:
  application:
    name: vitalsshield-server
  profiles:
    group:
      # DECISIONS 99: --spring.profiles.active=demo also activates local (LocalStack KMS, rebuild allowed).
      demo: local
  main:
    # Required: later phases bind every port manually after startup
    # reconciliation, so Spring must never bind a port itself.
    web-application-type: none
    # Reactor Netty event-loop threads are daemon threads, so without this the JVM exits right after
    # BootSequence binds the listeners. Keeps one non-daemon thread alive until the context closes.
    keep-alive: true
  datasource:
    url: jdbc:postgresql://localhost:5433/vitalsshield  # Compose maps host 5433 -> container 5432
    username: vitalsshield
    password: vitalsshield
  flyway:
    enabled: true
    locations: classpath:db/migration

vitalsshield:
  pki:
    public-base-url: https://localhost:8444
    # Production default: never regenerate CA keys; a missing key fails startup.
    allow-hierarchy-rebuild: false
    trust-file: var/trust/root-ca.pem
    leaf-ttl: PT12H
    # Protocol B: a RENEWED certificate keeps working this long after its successor's first batch (DECISIONS #84).
    renewal-grace: PT60S
    gateway-leaf-ttl: PT24H
  listeners:
    bind-host: 127.0.0.1
    mtls-port: 8443
    public-port: 8444
    admin-port: 8445
  eviction:
    enabled: true
  # Phase 9 (DECISIONS #90 to #98). Thresholds and windows live here, not in code.
  reenroll:
    challenge-max-age: PT60S     # |JVM now - issued_at_ms| for a Protocol C challenge
    per-address-limit: 10        # GET /api/v1/devices/challenge per remote address per rate-window
    global-limit: 100            # ... and in total
    rate-window: PT1M
    collision-window: PT30S      # an ingest this recent counts as a live session (DECISIONS #91)
  anomaly:
    sequence-regression:         # DECISIONS #93
      enabled: true
      threshold: 3
      window: PT60S
    post-drain:                  # DECISIONS #94
      enabled: true
      slack: PT5S
      drain-interval: PT0.25S
      queue-capacity: 1024
  backstop:                      # DECISIONS #96
    enabled: true
    interval: PT3S
    lookback: PT30S
  clock:                         # DECISIONS #98
    amber-ms: 2000
    red-ms: 10000
    check-interval: PT60S
  dashboard:
    # Next.js static export served on the admin port (DECISIONS #47). Relative to the working directory (repo root).
    dir: dashboard/out
  admin:
    # Boot-generated bearer code for /api/v1/admin/** until WebAuthn (DECISIONS #41). Mode 600.
    setup-code-file: var/admin/setup-code
